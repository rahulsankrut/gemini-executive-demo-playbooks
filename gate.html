<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Access Gate — Executive Storybook Rack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --desk-bg: #1B1613;
      --paper: #FFFDF8;
      --paper-warm: #F6EFE2;
      --paper-border: #D9CEBA;
      --ink: #231F1D;
      --ink-soft: #574F49;
      --terracotta: #C85A32;
      --forest: #2D6A4F;
      --gold-foil: #E8B86D;
      --font-serif: "Fraunces", Georgia, serif;
      --font-sans: "Plus Jakarta Sans", -apple-system, sans-serif;
      --font-mono: "IBM Plex Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: var(--font-sans);
      background-color: var(--desk-bg);
      background-image:
        radial-gradient(ellipse at 50% 25%, rgba(232, 184, 109, 0.14) 0%, transparent 62%),
        radial-gradient(ellipse at 50% 80%, rgba(200, 90, 50, 0.10) 0%, transparent 65%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--ink);
    }

    .gate-board {
      width: 100%;
      max-width: 520px;
      background: linear-gradient(145deg, #3A2E28 0%, #251D19 100%);
      border: 2px solid #524239;
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 36px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .gate-card {
      background: var(--paper);
      border-radius: 16px;
      padding: 36px 34px 32px;
      border: 1.5px solid var(--paper-border);
      box-shadow: 0 6px 0 #DFD4C0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--terracotta);
      background: #FDECE5;
      border: 1px solid rgba(200, 90, 50, 0.28);
      padding: 5px 11px;
      border-radius: 6px;
      width: fit-content;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.02em;
    }

    h1 em {
      color: var(--terracotta);
      font-style: italic;
    }

    .lead {
      font-size: 14.5px;
      line-height: 1.5;
      color: var(--ink-soft);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    label {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    select, input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      font-family: var(--font-sans);
      font-size: 15px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--paper-border);
      background: #FFFFFF;
      color: var(--ink);
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    select:focus, input:focus {
      border-color: var(--terracotta);
      box-shadow: 0 0 0 3px rgba(200, 90, 50, 0.15);
    }

    .custom-user-wrap {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 12px 14px;
      background: var(--paper-warm);
      border: 1px dashed var(--paper-border);
      border-radius: 10px;
    }

    .custom-user-wrap.visible {
      display: flex;
    }

    .pw-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .pw-wrap input {
      padding-right: 72px;
    }

    .pw-toggle {
      position: absolute;
      right: 10px;
      background: var(--paper-warm);
      border: 1px solid var(--paper-border);
      border-radius: 6px;
      padding: 4px 9px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-soft);
      cursor: pointer;
    }

    .error-msg {
      display: none;
      font-size: 13.5px;
      font-weight: 600;
      color: #B42318;
      background: #FEF3F2;
      border: 1px solid #FECDCA;
      padding: 10px 12px;
      border-radius: 8px;
    }

    .error-msg.visible {
      display: block;
    }

    .submit-btn {
      margin-top: 4px;
      width: 100%;
      background: linear-gradient(135deg, #C85A32 0%, #A9431E 100%);
      color: #FFFDF9;
      border: 2px solid #883315;
      border-radius: 12px;
      padding: 15px 20px;
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 0 #7A2C11, 0 10px 20px rgba(200, 90, 50, 0.25);
      transition: transform 0.15s, filter 0.15s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .submit-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #7A2C11;
    }

    .foot-note {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-soft);
      text-align: center;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="gate-board">
    <form class="gate-card" id="gateForm">
      <span class="kicker" id="gateKicker">🔒 EXECUTIVE WORKSHOP · TEAM REVIEW GATE</span>
      <h1>Executive <em>Storybook Rack</em></h1>
      <p class="lead">
        Select your name (so your inline edits &amp; page comments are attributed to you) and enter the workshop password to open the three hands-on volumes.
      </p>

      <div class="field-group">
        <label for="reviewerSelect">1. Select Your Name</label>
        <select id="reviewerSelect" required>
          <option value="" disabled selected>Choose your name from the list…</option>
          <option value="Executive Sponsor">Executive Sponsor</option>
          <option value="Product Lead">Product Lead</option>
          <option value="Engineering Lead">Engineering Lead</option>
          <option value="Finance Lead">Finance Lead</option>
          <option value="Legal Lead">Legal Lead</option>
          <option value="__custom__">+ Not listed — Add my name…</option>
        </select>
      </div>

      <div class="custom-user-wrap" id="customUserWrap">
        <div class="field-group">
          <label for="customName">Your Full Name</label>
          <input type="text" id="customName" placeholder="e.g. Jane Doe" />
        </div>
        <div class="field-group">
          <label for="customEmail">Email (Optional)</label>
          <input type="email" id="customEmail" placeholder="e.g. janedoe@company.com" />
        </div>
      </div>

      <div class="field-group">
        <label for="accessPassword">2. Access Password</label>
        <div class="pw-wrap">
          <input type="password" id="accessPassword" placeholder="Enter workshop password" autocomplete="current-password" required />
          <button type="button" class="pw-toggle" id="btnTogglePw">SHOW</button>
        </div>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <button type="submit" class="submit-btn" id="btnSubmit">Unlock Storybooks →</button>
      <div class="foot-note">Edits &amp; comments are saved live for team review</div>
    </form>
  </div>

  <script>
    const reviewerSelect = document.getElementById('reviewerSelect');
    const customWrap = document.getElementById('customUserWrap');
    const customName = document.getElementById('customName');
    const customEmail = document.getElementById('customEmail');
    const pwInput = document.getElementById('accessPassword');
    const btnTogglePw = document.getElementById('btnTogglePw');
    const errorMsg = document.getElementById('errorMsg');
    const btnSubmit = document.getElementById('btnSubmit');

    function applySavedReviewer() {
      try {
        const saved = JSON.parse(localStorage.getItem('agy_sb_reviewer') || 'null');
        if (saved && saved.full) {
          const matchOpt = Array.from(reviewerSelect.options).find((o) => o.value === saved.full);
          if (matchOpt) {
            reviewerSelect.value = saved.full;
            customWrap.classList.remove('visible');
          } else {
            reviewerSelect.value = '__custom__';
            customWrap.classList.add('visible');
            customName.value = saved.name || '';
            customEmail.value = saved.email || '';
          }
        }
      } catch (_) {}
    }

    (async function loadPublicConfig() {
      try {
        const res = await fetch('/api/public-config', { cache: 'no-store' });
        if (res.ok) {
          const cfg = await res.json();
          if (cfg.gate_kicker) {
            document.getElementById('gateKicker').textContent = cfg.gate_kicker;
          }
          if (Array.isArray(cfg.roster) && cfg.roster.length) {
            reviewerSelect.innerHTML = '<option value="" disabled selected>Choose your name from the list…</option>';
            cfg.roster.forEach((item) => {
              const opt = document.createElement('option');
              opt.value = item;
              opt.textContent = item;
              reviewerSelect.appendChild(opt);
            });
            const customOpt = document.createElement('option');
            customOpt.value = '__custom__';
            customOpt.textContent = '+ Not listed — Add my name…';
            reviewerSelect.appendChild(customOpt);
          }
        }
      } catch (_) {}
      applySavedReviewer();
    })();

    reviewerSelect.addEventListener('change', () => {
      const isCustom = reviewerSelect.value === '__custom__';
      customWrap.classList.toggle('visible', isCustom);
      if (isCustom) customName.focus();
    });

    btnTogglePw.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      btnTogglePw.textContent = show ? 'HIDE' : 'SHOW';
    });

    function parseIdentity() {
      const val = reviewerSelect.value;
      if (!val) return null;
      if (val === '__custom__') {
        const name = customName.value.trim();
        const email = customEmail.value.trim();
        if (!name) return null;
        return {
          name,
          email,
          full: email ? `${name} <${email}>` : name
        };
      }
      const m = val.match(/^(.*?)\s*<([^>]+)>$/);
      if (m) {
        return { name: m[1].trim(), email: m[2].trim(), full: val };
      }
      return { name: val, email: '', full: val };
    }

    document.getElementById('gateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');

      const identity = parseIdentity();
      if (!identity) {
        errorMsg.textContent = 'Please select your name from the dropdown or enter your name.';
        errorMsg.classList.add('visible');
        return;
      }

      const password = pwInput.value;
      if (!password) {
        errorMsg.textContent = 'Please enter the access password.';
        errorMsg.classList.add('visible');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Unlocking…';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password, reviewer: identity })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          errorMsg.textContent = data.error || 'Incorrect password. Please try again.';
          errorMsg.classList.add('visible');
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Unlock Storybooks →';
          return;
        }
        localStorage.setItem('agy_sb_reviewer', JSON.stringify(identity));
        const params = new URLSearchParams(window.location.search);
        const nextUrl = params.get('next') || '/';
        window.location.href = nextUrl.startsWith('/') ? nextUrl : '/';
      } catch (err) {
        errorMsg.textContent = 'Network error verifying password. Please try again.';
        errorMsg.classList.add('visible');
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Unlock Storybooks →';
      }
    });
  </script>
</body>
</html>
